[workspace]
members = [
    "crates/mach-common",
    "crates/mach-hypervisor",
    "crates/mach-vmm",
    "crates/mach-virtio",
    "crates/mach-cli",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
authors = ["Mach Contributors"]
license = "MIT"
repository = "https://github.com/douglaslobo/mach"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "color", "env"] }
clap_complete = "4"

# Unix system calls
nix = { version = "0.29", features = ["mman", "signal", "process", "fs", "ioctl", "net", "user", "hostname"] }
libc = "0.2"

# IPC / communication
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# Config
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Misc
once_cell = "1"
parking_lot = "0.12"
bitflags = "2"
